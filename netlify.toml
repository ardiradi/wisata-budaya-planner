# Competition-only hosting. No provider credentials belong in this file or site.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_COMPETITION_DEMO = "true"
  GEMINI_DEMO_SMOKE_ENABLED = "false"

# Netlify detects Next.js and uses its supported OpenNext adapter.
# Do not publish the unprocessed .next directory using a static-only uploader.
